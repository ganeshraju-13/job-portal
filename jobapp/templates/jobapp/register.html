<!DOCTYPE html>
{% load static %}

<html>
<head>
    <title>Register - Job Portal</title>
    <link rel="stylesheet" href="{% static 'jobapp/style.css' %}">
</head>

<body>

    <div class="navbar">
        <h2>Job Portal</h2>

        <div>
            <a href="/">Jobs</a>
            <a href="{% url 'login' %}">Login</a>
        </div>
    </div>


    <div class="container">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p style="text-align: center; color: #6b7280;">
                Create an account to apply for jobs
            </p>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">
                    <label>Username</label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Choose a username"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p style="text-align: center; margin-top: 20px;">
                Already have an account?
                <a href="{% url 'login' %}">
                    Login
                </a>
            </p>

        </div>

    </div>


    <div class="footer">
        Job Portal &copy; 2026
    </div>

</body>
</html>
