<!DOCTYPE html>
{% load static %}

<html>
<head>
    <title>Login - Job Portal</title>
    <link rel="stylesheet" href="{% static 'jobapp/style.css' %}">
</head>

<body>

    <div class="navbar">
        <h2>Job Portal</h2>

        <div>
            <a href="/">Jobs</a>
            <a href="{% url 'register' %}">Register</a>
        </div>
    </div>


    <div class="container">

        <div class="auth-card">

            <h1>Welcome Back</h1>

            <p style="text-align: center; color: #6b7280;">
                Login to your account to continue
            </p>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">
                    <label>Username</label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <p style="text-align: center; margin-top: 20px;">
                Don't have an account?
                <a href="{% url 'register' %}">
                    Create an account
                </a>
            </p>

        </div>

    </div>


    <div class="footer">
        Job Portal &copy; 2026
    </div>

</body>
</html>
