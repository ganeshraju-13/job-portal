<!DOCTYPE html>
{% load static %}

<html>
<head>
    <title>Edit Job - Job Portal</title>
    <link rel="stylesheet" href="{% static 'jobapp/style.css' %}">
</head>

<body>

    <div class="navbar">
        <h2>Job Portal</h2>

        <div>
            <a href="/">Jobs</a>

            <a href="{% url 'my_applications' %}">
                My Applications
            </a>

            <form method="POST"
                  action="{% url 'logout' %}"
                  style="display: inline;">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        </div>
    </div>


    <div class="container">

        <div class="form-card">

            <h1>Edit Job</h1>

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">
                    <label>Job Title</label>
                    <input
                        type="text"
                        name="title"
                        value="{{ job.title }}"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Company</label>
                    <input
                        type="text"
                        name="company"
                        value="{{ job.company }}"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Location</label>
                    <input
                        type="text"
                        name="location"
                        value="{{ job.location }}"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Salary</label>
                    <input
                        type="text"
                        name="salary"
                        value="{{ job.salary }}"
                    >
                </div>


                <div class="form-group">
                    <label>Description</label>
                    <textarea
                        name="description"
                        rows="8"
                        required
                    >{{ job.description }}</textarea>
                </div>


                <button type="submit">
                    Update Job
                </button>

                <a
                    href="{% url 'job_detail' job.id %}"
                    class="btn"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>


    <div class="footer">
        Job Portal &copy; 2026
    </div>

</body>
</html>
