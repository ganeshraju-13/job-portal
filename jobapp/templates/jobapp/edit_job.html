<!DOCTYPE html>
{% load static %}

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Job - JobPortal</title>

    <link rel="stylesheet" href="{% static 'jobapp/style.css' %}">
</head>

<body>

<nav class="navbar">

    <div class="navbar-brand">
        <a href="/">JobPortal</a>
    </div>

    <div class="navbar-links">

        <a href="/">Jobs</a>

        <a href="{% url 'admin_dashboard' %}">
            Dashboard
        </a>

        <a href="{% url 'admin_applications' %}">
            Applications
        </a>

        <form method="POST"
              action="{% url 'logout' %}"
              class="logout-form">

            {% csrf_token %}

            <button type="submit"
                    class="logout-button">
                Logout
            </button>

        </form>

    </div>

</nav>


<main class="edit-job-container">

    <div class="edit-job-card">

        <div class="edit-job-header">

            <p class="section-label">
                ADMINISTRATION
            </p>

            <h1>Edit Job</h1>

            <p>
                Update the job information below.
            </p>

        </div>


        <form method="POST">

            {% csrf_token %}


            <div class="edit-form-group">

                <label for="title">
                    Job Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ job.title }}"
                    required
                >

            </div>


            <div class="edit-form-group">

                <label for="company">
                    Company
                </label>

                <input
                    type="text"
                    id="company"
                    name="company"
                    value="{{ job.company }}"
                    required
                >

            </div>


            <div class="edit-form-group">

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    value="{{ job.location }}"
                    required
                >

            </div>


            <div class="edit-form-group">

                <label for="salary">
                    Salary
                </label>

                <input
                    type="text"
                    id="salary"
                    name="salary"
                    value="{{ job.salary }}"
                >

            </div>


            <div class="edit-form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="8"
                    required
                >{{ job.description }}</textarea>

            </div>


            <div class="edit-job-actions">

                <a href="{% url 'job_detail' job.id %}"
                   class="cancel-edit-button">
                    Cancel
                </a>

                <button type="submit"
                        class="save-job-button">
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</main>


<footer class="footer">

    <div class="footer-content">

        <div>

            <h3>JobPortal</h3>

            <p>
                Connecting talented people with great opportunities.
            </p>

        </div>

        <div class="footer-bottom">
            © 2026 JobPortal. All rights reserved.
        </div>

    </div>

</footer>

</body>

</html>
