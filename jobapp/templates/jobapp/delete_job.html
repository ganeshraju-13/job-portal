<!DOCTYPE html>
{% load static %}

<html>
<head>
    <title>Delete Job - Job Portal</title>
    <link rel="stylesheet" href="{% static 'jobapp/style.css' %}">
</head>

<body>

    <div class="navbar">
        <h2>Job Portal</h2>

        <div>
            <a href="/">Jobs</a>

            {% if user.is_authenticated %}
                <form method="POST"
                      action="{% url 'logout' %}"
                      style="display: inline;">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            {% endif %}
        </div>
    </div>


    <div class="container">

        <div class="form-card" style="text-align: center;">

            <h1>Delete Job</h1>

            <p>
                Are you sure you want to delete
                <strong>{{ job.title }}</strong>?
            </p>

            <p style="color: #6b7280;">
                This action cannot be undone.
            </p>

            <form method="POST">
                {% csrf_token %}

                <button type="submit" class="delete-btn">
                    Yes, Delete Job
                </button>
            </form>

            <br>

            <a href="{% url 'job_detail' job.id %}">
                Cancel
            </a>

        </div>

    </div>


    <div class="footer">
        Job Portal &copy; 2026
    </div>

</body>
</html>
